name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One run per PR ref (new pushes cancel older runs); everything else gets its own group so a release gate is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (core, Redis, Valkey, Android unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6380:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      VALKEY_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # `build` runs every module's unit tests and Android lint. The Redis tests skip silently when no server is
      # reachable, so fail loudly here if the service containers are not what they should be.
      - name: Check Redis and Valkey are reachable
        run: |
          python3 - <<'PY'
          import socket, sys
          for name, port in (("redis", 6379), ("valkey", 6380)):
              try:
                  socket.create_connection(("localhost", port), timeout=5).close()
                  print(f"{name} reachable on {port}")
              except OSError as e:
                  sys.exit(f"{name} not reachable on {port}: {e}")
          PY
      - run: ./gradlew build
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  android-device:
    name: Android Keystore tests (emulator)
    # Slow; runs on main, manual and release runs, not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :android:connectedDebugAndroidTest
      - name: Upload device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports
          path: android/build/reports/
          if-no-files-found: ignore
