name: Release

# Two ways to release:
#   1. Actions tab -> Release -> Run workflow, enter a version (1.2.3 or 1.2.3-rc.1). Runs from main. The tag is
#      created only after every check has passed. Recommended.
#   2. Push a tag yourself (git tag v1.2.3 && git push origin v1.2.3). The tag must be on main. The tag exists from the
#      start, so JitPack can build it before the checks finish; the GitHub Release is still gated on them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 or 1.2.3-rc.1 (a leading v is optional)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          scripts/resolve-version.sh "${INPUT_VERSION:-$GITHUB_REF_NAME}" | tee -a "$GITHUB_OUTPUT"
      - name: Check where this release comes from
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run this workflow from main (was $GITHUB_REF)"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists. Versions are immutable; choose a new one."; exit 1
            fi
          else
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::Tag $TAG is not on main"; exit 1; }
          fi

  checks:
    name: Checks
    needs: prepare
    uses: ./.github/workflows/ci.yml

  publish:
    name: Tag, release, JitPack
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4

      # Build exactly what consumers will get and check it before anything is published or tagged.
      - name: Build artifacts
        run: ./gradlew publishToMavenLocal -PreleaseVersion="$VERSION" -x test -Dmaven.repo.local="$RUNNER_TEMP/m2"
      - name: Verify artifacts
        run: scripts/verify-artifacts.sh "$RUNNER_TEMP/m2" com.timothymugo "$VERSION"

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          mkdir dist
          find "$RUNNER_TEMP/m2/com/timothymugo" \( -name '*.jar' -o -name '*.aar' \) -exec cp {} dist/ \;
          flags=(--verify-tag --generate-notes --title "$TAG")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" dist/*

      # JitPack builds on first request. It only builds public repositories on the free plan, so this is skipped
      # for private ones.
      - name: Build on JitPack and wait
        if: ${{ !github.event.repository.private }}
        run: scripts/wait-for-jitpack.sh "com.github.${{ github.repository_owner }}" "${{ github.event.repository.name }}" "$TAG"

      - name: Summary
        run: |
          {
            echo "## Released $TAG"
            echo
            echo "GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
            echo
            echo "JitPack: https://jitpack.io/#${{ github.repository_owner }}/${{ github.event.repository.name }}/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
