name: Release

# Releases with JReleaser (https://jreleaser.org). To release, bump `libraryVersion` in gradle.properties and merge that to
# main. On every push to main (and on manual dispatch, which does the same) this workflow looks for a GitHub Release for
# v<libraryVersion>; if there is none it runs all checks, then JReleaser tags the commit, writes the changelog from the commit
# messages and creates the GitHub Release with the jars and AARs attached. JitPack then builds the tag for consumers.
# A push that doesn't change the version finds the release already exists and does nothing. Re-running is always safe.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: JReleaser shows what it would do and creates nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      skip_tag: ${{ steps.plan.outputs.skip_tag }}
    steps:
      - name: Releases run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main (was $GITHUB_REF)"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-plan.sh | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          {
            echo "## Release plan"
            echo
            if [ "$RELEASE" = "true" ]; then
              echo "\`v$VERSION\` has no GitHub Release yet: running checks, then JReleaser."
            else
              echo "\`v$VERSION\` is already released. To release, bump \`libraryVersion\` in \`gradle.properties\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: JReleaser
    needs: [plan, checks]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SKIP_TAG: ${{ needs.plan.outputs.skip_tag }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4

      # Stage exactly what consumers will get into release/build/staging-deploy and check it before JReleaser sees it.
      - name: Stage artifacts
        run: ./gradlew publish -x test
      - name: Verify artifacts
        run: scripts/verify-artifacts.sh release/build/staging-deploy com.timothymugo "$VERSION"

      # JReleaser runs from its own build in release/ (it can't share a classpath with the Android Gradle Plugin).
      - name: JReleaser
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_DRY_RUN: ${{ env.DRY_RUN }}
        run: ./gradlew -p release jreleaserRelease -PskipTag="$SKIP_TAG"

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser
          path: |
            release/build/jreleaser/trace.log
            release/build/jreleaser/output.properties
            release/build/jreleaser/release/CHANGELOG.md
          if-no-files-found: ignore

      # JitPack builds on first request. It only builds public repositories on the free plan, so this is skipped for
      # private ones, and for dry runs (no tag exists then).
      - name: Build on JitPack and wait
        if: ${{ env.DRY_RUN != 'true' && !github.event.repository.private }}
        run: scripts/wait-for-jitpack.sh "com.github.${{ github.repository_owner }}" "${{ github.event.repository.name }}" "$TAG"

      - name: Summary
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run of $TAG: nothing was created"
            else
              echo "## Released $TAG"
              echo
              echo "GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
              echo
              echo "JitPack: https://jitpack.io/#${{ github.repository_owner }}/${{ github.event.repository.name }}/$TAG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
